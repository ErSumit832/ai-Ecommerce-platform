apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
  namespace: ai-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
      - name: ai-backend
        image: sumitkdevops/ai-backend:5
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: postgresql://ecommerce_user:ecommerce_pass@postgres:5432/ecommerce_db