apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: ecommerce_user
        - name: POSTGRES_PASSWORD
          value: ecommerce_pass
        - name: POSTGRES_DB
          value: ecommerce_db