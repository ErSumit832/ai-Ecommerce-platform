# TEMPLATE ONLY — replace every placeholder before applying, and never commit
# the real, filled-in version of this file to source control.
#
# Prefer one of these over hand-editing and applying this file directly:
#   kubectl create secret generic ecommerce-secrets -n ecommerce-ai \
#     --from-literal=SECRET_KEY='...' \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db' \
#     --from-literal=REDIS_URL='redis://host:6379/0' \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...'
# or, for production, a secrets manager integration such as External Secrets
# Operator / AWS Secrets Manager / Sealed Secrets instead of a plain Secret.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-ai
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_WITH_A_RANDOM_64_CHAR_STRING"
  # POSTGRES_PASSWORD and DATABASE_URL must use the SAME password — the
  # former is consumed by the dev/demo Postgres StatefulSet (03-postgres.yaml),
  # the latter by the backend. In production, drop POSTGRES_PASSWORD and point
  # DATABASE_URL at your RDS instance instead.
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql://ecommerce_user:REPLACE_ME@postgres:5432/ecommerce_db"
  REDIS_URL: "redis://redis:6379/0"
  OPENAI_API_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
